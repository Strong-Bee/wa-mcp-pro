services:
  wa-mcp-pro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wa-mcp-pro
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      MCP_TRANSPORT: http
      MCP_HTTP_ENABLED: "true"
      MCP_HTTP_PORT: 3001
      DATABASE_URL: /app/storage/wa-mcp.db
      SESSION_DIRECTORY: /app/storage/sessions
      MEDIA_DIRECTORY: /app/storage/media
      LOG_DIRECTORY: /app/storage/logs
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY to a 64-character hexadecimal key}
      LOG_LEVEL: info
      RATE_LIMIT_MAX: 100
      RATE_LIMIT_WINDOW: 60000
      MAX_MEDIA_SIZE_MB: 50
      WHATSAPP_AUTO_RECONNECT: "true"
      WHATSAPP_RECONNECT_MAX_ATTEMPTS: 10
      WHATSAPP_MESSAGE_HISTORY_LIMIT: 10000
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - wa_mcp_storage:/app/storage
    healthcheck:
      test: ["CMD", "node", "dist/scripts/health-check.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  wa_mcp_storage:
    driver: local
